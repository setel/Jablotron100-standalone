[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jablotron100-standalone"
version = "0.3.1"
description = "Home Assistant independent client library for Jablotron 100+ alarm panels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
